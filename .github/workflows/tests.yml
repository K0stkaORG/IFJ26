# AI generated by: Codex/GPT-6
# Prompt: "Turn the tests we have into a github actions. I want them to run before a PR is allowed to be merged into main. There should be one action checking commits using the script in the repo and then another action running tests. These actions should run on self-hosted linux runners (repo has access to these)."
# Changes: Run the existing unit, end-to-end, and memory suites against the pull request merge result.
name: Tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# AI generated by: Codex/GPT-6
# Prompt: "The runners are hosted on ssh root@byttorrent in github actions stack.
#
# Also make it so that unit, e2e and memory tests count as different checks"
# Changes: Give each suite its own check and provision missing compiler and Valgrind tools inside the runner.
jobs:
  tests:
    name: ${{ matrix.suite.name }}
    runs-on: [self-hosted, linux]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite:
          - name: Unit tests
            target: test-unit
          - name: End-to-end tests
            target: test-e2e
          - name: Memory tests
            target: test-memory
    steps:
      - name: Check out pull request merge result
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install missing test tools
        shell: bash
        run: |
          if ! command -v clang || ! command -v "${VALGRIND_BIN:-valgrind}"; then
            sudo -n apt-get update
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y clang valgrind
          fi
          command -v "${VALGRIND_BIN:-valgrind}"
      - name: Run ${{ matrix.suite.name }}
        shell: bash
        run: make ${{ matrix.suite.target }}
