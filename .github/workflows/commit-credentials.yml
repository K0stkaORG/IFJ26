# Changes: Run the repository's commit identity script on commits introduced by pull requests to main.
name: Commit credentials

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  commit-credentials:
    name: Commit credentials
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Check out pull request with history
        # AI generated by: Codex/gpt-6.2-sol
        # Prompt: "Bump the versions of the github actions to the latest version + at the end of e2e and memory, print the summary to the terminal (so that its visible in the action log)"
        # Changes: Pin checkout to v7.0.1.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check author and committer identities
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
