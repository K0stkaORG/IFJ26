    name: Commit credentials
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - name: Check out pull request with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
